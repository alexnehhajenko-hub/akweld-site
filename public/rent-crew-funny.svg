<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#070a0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffc400" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect width="1400" height="900" fill="url(#glow)"/>

  <!-- blueprint-ish grid -->
  <g opacity="0.10" stroke="#fff" stroke-width="1">
    <path d="M0 120H1400M0 240H1400M0 360H1400M0 480H1400M0 600H1400M0 720H1400M0 840H1400"/>
    <path d="M120 0V900M240 0V900M360 0V900M480 0V900M600 0V900M720 0V900M840 0V900M960 0V900M1080 0V900M1200 0V900M1320 0V900"/>
  </g>

  <!-- card -->
  <g transform="translate(120,140)">
    <rect x="0" y="0" rx="26" ry="26" width="1160" height="620" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
    <rect x="26" y="26" rx="20" ry="20" width="1108" height="110" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.10)"/>
    <text x="60" y="92" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="44" font-weight="900" fill="rgba(255,255,255,0.92)">
      RENT CREW (JOKE)
    </text>
    <text x="60" y="128" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="20" fill="rgba(255,255,255,0.70)">
      Illustration for a humorous “staff rental” card (no real people).
    </text>

    <!-- characters -->
    <g transform="translate(90,190)">
      <!-- glow blobs -->
      <circle cx="200" cy="210" r="120" fill="#ffc400" opacity="0.12" filter="url(#soft)"/>
      <circle cx="560" cy="190" r="140" fill="#ff8a00" opacity="0.10" filter="url(#soft)"/>
      <circle cx="900" cy="220" r="120" fill="#ffc400" opacity="0.10" filter="url(#soft)"/>

      <!-- person 1 -->
      <g transform="translate(90,40)">
        <circle cx="90" cy="70" r="46" fill="rgba(255,255,255,0.88)"/>
        <rect x="48" y="120" width="84" height="170" rx="34" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.20)"/>
        <rect x="20" y="300" width="140" height="26" rx="13" fill="rgba(255,255,255,0.14)"/>
        <!-- mug -->
        <rect x="150" y="160" width="44" height="66" rx="10" fill="rgba(255,196,0,0.35)" stroke="rgba(255,196,0,0.45)"/>
        <rect x="193" y="175" width="18" height="36" rx="9" fill="none" stroke="rgba(255,196,0,0.55)" stroke-width="6"/>
      </g>

      <!-- person 2 -->
      <g transform="translate(410,20)">
        <circle cx="110" cy="86" r="52" fill="rgba(255,255,255,0.88)"/>
        <rect x="58" y="142" width="104" height="210" rx="40" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.20)"/>
        <rect x="20" y="366" width="200" height="28" rx="14" fill="rgba(255,255,255,0.14)"/>
        <!-- bottle -->
        <rect x="220" y="170" width="26" height="92" rx="10" fill="rgba(255,138,0,0.30)" stroke="rgba(255,138,0,0.50)"/>
        <rect x="226" y="150" width="14" height="26" rx="6" fill="rgba(255,138,0,0.30)" stroke="rgba(255,138,0,0.50)"/>
      </g>

      <!-- person 3 -->
      <g transform="translate(800,50)">
        <circle cx="90" cy="70" r="46" fill="rgba(255,255,255,0.88)"/>
        <rect x="48" y="120" width="84" height="170" rx="34" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.20)"/>
        <rect x="20" y="300" width="140" height="26" rx="13" fill="rgba(255,255,255,0.14)"/>
        <!-- mug -->
        <rect x="150" y="160" width="44" height="66" rx="10" fill="rgba(255,196,0,0.35)" stroke="rgba(255,196,0,0.45)"/>
        <rect x="193" y="175" width="18" height="36" rx="9" fill="none" stroke="rgba(255,196,0,0.55)" stroke-width="6"/>
      </g>

      <text x="0" y="470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" fill="rgba(255,255,255,0.70)">
        Use this only as a joke image. Replace later with real project photos.
      </text>
    </g>
  </g>
</svg>
